<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><link rel="manifest" href="/manifest.webmanifest"><title>Architect</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:850px;margin:auto;min-height:100vh;padding:22px 18px 40px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-weight:800;font-size:22px}.status{font-size:12px;color:#9aa4af}.card{background:#15191f;border:1px solid #252b33;border-radius:18px;padding:16px;margin-bottom:14px}textarea{width:100%;min-height:120px;resize:vertical;background:#0f1216;color:#fff;border:1px solid #303741;border-radius:14px;padding:14px;font-size:16px;outline:none}button{border:1px solid #343b45;background:#20262e;color:#fff;border-radius:11px;padding:11px 14px;font-size:14px}button.primary{background:#f4f6f8;color:#0b0d10;border-color:#f4f6f8;font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tool{padding:12px;border-radius:12px;background:#101419;border:1px solid #252b33}.tool b{display:block;margin-bottom:4px}.tool span{font-size:12px;color:#9aa4af}pre{white-space:pre-wrap;word-break:break-word;background:#0f1216;padding:14px;border-radius:12px;max-height:520px;overflow:auto}.hide{display:none}.msg{color:#aeb7c2;font-size:13px;line-height:1.5}@media(max-width:600px){main{padding:15px 12px}.grid{grid-template-columns:1fr}}
</style></head><body><main><header><div class="brand">ARCHITECT</div><div class="status" id="status">起動中</div></header>
<section class="card"><div class="msg">思考AIとAI OSを分離した司令塔。ファイルを毎回表示せず、このアプリから使います。</div><textarea id="input" placeholder="何をしたい？ 例：カメラの映像を見て、今起きていることを説明して"></textarea><div class="row"><button class="primary" onclick="send()">実行</button><button onclick="voice()">音声入力</button><button onclick="clearAll()">クリア</button></div></section>
<section class="card"><b>接続できる外部機能</b><div class="grid" id="tools"></div></section>
<section class="card"><b>思考結果</b><pre id="out">ここにArchitectの判断が表示されます。</pre></section>
<section class="card"><b>AI設計・アップデート</b><div class="row"><button onclick="design()">新しいAIを設計</button><button onclick="updateAI()">現在のAIをアップデート</button></div></section>
<script>
let last=null,pid=null;const $=id=>document.getElementById(id);const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=SR?new SR():null;if(rec){rec.lang='ja-JP';rec.continuous=false;rec.onresult=e=>{$('input').value+=( $('input').value?' ':'')+e.results[0][0].transcript}}
function voice(){if(rec)rec.start();else $('status').textContent='このブラウザでは音声入力を利用できません'}
async function send(){const message=$('input').value.trim();if(!message)return;busy('思考中…');try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});last=await r.json();$('out').textContent=JSON.stringify(last,null,2);$('status').textContent='待機中'}catch(e){$('out').textContent=e;busy('接続エラー')}}
async function design(){const idea=$('input').value.trim();if(!idea)return;busy('AI設計中…');const r=await fetch('/architect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idea})});last=await r.json();pid=last.project_id;$('out').textContent=JSON.stringify(last,null,2);busy('設計完了')}
async function updateAI(){if(!pid){$('status').textContent='先に「新しいAIを設計」を実行してください';return}const request=$('input').value.trim();if(!request)return;busy('アップデート設計中…');const r=await fetch('/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_id:pid,request})});last=await r.json();$('out').textContent=JSON.stringify(last,null,2);busy('アップデート完了')}
async function loadTools(){try{const r=await fetch('/tools');const j=await r.json();$('tools').innerHTML=Object.entries(j.tools).map(([k,v])=>`<div class="tool"><b>${k}</b><span>${v}</span></div>`).join('');$('status').textContent='オンライン'}catch(e){$('status').textContent='オフライン'}}
function busy(x){$('status').textContent=x}function clearAll(){$('input').value='';$('out').textContent='ここにArchitectの判断が表示されます。'}loadTools();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></main></body></html>
